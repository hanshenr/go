name: Deploy site to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs (GitHub's standard layout): deploying in the same job,
  # right after the upload, intermittently fails with "No artifacts named github-pages".
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v6
      - name: Cache-bust scripts and styles
        run: sed -i -E "s/(src|href)=\"([a-z.-]+\.(js|css))\"/\1=\"\2?v=${GITHUB_SHA::8}\"/g" site/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
