<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Go</title>
  <meta name="description" content="Play Go online with a friend, on one device, or work through 300 problems.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <h1>Go</h1>
      <span class="brand-sub" lang="ja">囲碁</span>
    </div>
    <nav class="tabs" role="tablist" aria-label="Mode">
      <button role="tab" id="tab-play" data-tab="play" aria-controls="view-play">Play</button>
      <button role="tab" id="tab-problems" data-tab="problems" aria-controls="view-problems">Problems</button>
    </nav>
    <label class="coords-toggle" title="Show coordinates">
      <input type="checkbox" id="coords-toggle">
      <span>Coordinates</span>
    </label>
  </header>

  <div id="banner" class="banner" hidden></div>

  <main>
    <!-- Play: one shared game between two people -->
    <section id="view-play" class="view" role="tabpanel" aria-labelledby="tab-play" hidden>
      <div class="play-layout">
        <div class="stage"><div class="board-host" id="board-play"></div></div>
        <aside class="side">
          <p class="conn small" id="conn"></p>
          <div class="notice-inline" id="offline" hidden></div>
          <div class="game-head">
            <h2 id="play-title">Go</h2>
            <p class="muted small" id="play-meta"></p>
          </div>
          <div class="players" id="play-players"></div>
          <p class="status" id="play-status" aria-live="polite"></p>
          <div class="request" id="play-request" hidden></div>
          <div class="controls" id="play-controls"></div>
          <div class="controls secondary" id="play-controls-2"></div>

          <div class="review" id="review" hidden>
            <div class="rv-nav">
              <button class="btn icon" id="rv-first" aria-label="First move"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 3v10M12 3 7 8l5 5"/></svg></button>
              <button class="btn icon" id="rv-prev" aria-label="Previous move"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5"/></svg></button>
              <span class="rv-where" id="rv-where"></span>
              <button class="btn icon" id="rv-next" aria-label="Next move"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5"/></svg></button>
              <button class="btn icon" id="rv-last" aria-label="Last move"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M12 3v10M4 3l5 5-5 5"/></svg></button>
            </div>
            <input type="range" id="rv-slider" min="0" max="0" value="0" aria-label="Move">
            <div class="rv-explore" id="rv-explore" hidden>
              <span><strong>Exploring</strong> <span class="muted" id="rv-explore-text"></span></span>
              <button class="btn small" id="rv-reset">Reset</button>
            </div>
            <button class="btn small primary" id="rv-live" hidden>Back to game</button>
          </div>

          <form id="new-game" class="card new-game" autocomplete="off">
            <div class="field">
              <span class="label">Board</span>
              <div class="seg">
                <label><input type="radio" name="size" value="9"><span>9×9</span></label>
                <label><input type="radio" name="size" value="13"><span>13×13</span></label>
                <label><input type="radio" name="size" value="19" checked><span>19×19</span></label>
              </div>
            </div>
            <div class="field-row">
              <label class="field"><span class="label">Handicap</span>
                <select name="handicap">
                  <option value="0" selected>None</option>
                  <option>2</option><option>3</option><option>4</option><option>5</option>
                  <option>6</option><option>7</option><option>8</option><option>9</option>
                </select>
              </label>
              <label class="field"><span class="label">Komi</span>
                <select name="komi">
                  <option value="0.5">0.5</option>
                  <option value="5.5">5.5</option>
                  <option value="6.5" selected>6.5</option>
                  <option value="7.5">7.5</option>
                </select>
              </label>
            </div>
            <div class="new-row">
              <label class="field"><span class="label">You play</span>
                <select name="color">
                  <option value="B" selected>Black</option>
                  <option value="W">White</option>
                  <option value="R">Random</option>
                </select>
              </label>
              <button type="button" class="btn primary" id="new-game-btn">New game</button>
            </div>
          </form>
          <label class="name-field"><span class="label">Your name</span>
            <input type="text" id="my-name" maxlength="40" autocomplete="nickname" spellcheck="false">
          </label>
          <p class="hint muted small">Both of you open this same page and you're connected automatically. Keys: <kbd>P</kbd> pass, <kbd>&larr;</kbd> <kbd>&rarr;</kbd> review</p>
        </aside>
      </div>
    </section>

    <!-- Problems -->
    <section id="view-problems" class="view" role="tabpanel" aria-labelledby="tab-problems" hidden>
      <div class="problems-layout">
        <aside class="plist">
          <div class="plist-head">
            <input type="search" id="p-search" placeholder="Search number or title" aria-label="Search problems">
            <div class="plist-filters">
              <select id="p-level" aria-label="Level"><option value="">All levels</option></select>
              <label class="check"><input type="checkbox" id="p-unsolved"> Unsolved</label>
            </div>
            <p class="muted small" id="p-count"></p>
          </div>
          <ol id="p-list" class="p-list"></ol>
        </aside>
        <div class="stage"><div class="board-host" id="board-problem"></div></div>
        <aside class="side">
          <div class="game-head">
            <p class="eyebrow" id="p-eyebrow"></p>
            <h2 id="p-title">Problems</h2>
            <p class="prompt" id="p-prompt"></p>
          </div>
          <div class="feedback" id="p-feedback" aria-live="polite"></div>
          <div class="controls" id="p-controls">
            <button class="btn" id="p-retry">Retry</button>
            <button class="btn" id="p-solution">Show solution</button>
          </div>
          <div class="controls" id="p-steps" hidden>
            <button class="btn" id="p-step-back">Back</button>
            <button class="btn primary" id="p-step-fwd">Next move</button>
            <button class="btn ghost" id="p-step-exit">Done</button>
          </div>
          <div class="controls nav">
            <button class="btn" id="p-prev">&larr; Prev</button>
            <button class="btn" id="p-next">Next &rarr;</button>
          </div>
          <div class="from-here">
            <button class="btn" id="p-play">Play this position online</button>
          </div>
          <p class="muted small source" id="p-source"></p>
          <p class="hint muted small">Keys: <kbd>&larr;</kbd> <kbd>&rarr;</kbd> previous / next</p>
        </aside>
      </div>
    </section>
  </main>

  <dialog id="sgf-dialog" class="sgf-dialog">
    <form method="dialog">
      <h3>Game record (SGF)</h3>
      <textarea id="sgf-text" rows="8" readonly></textarea>
      <div class="controls">
        <a class="btn primary" id="sgf-download" download="game.sgf">Download</a>
        <button type="button" class="btn" id="sgf-copy">Copy</button>
        <button class="btn ghost" value="close">Close</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="peerjs.min.js"></script>
  <script src="go-engine.js"></script>
  <script src="problems.js"></script>
  <script src="app.js"></script>
</body>
</html>
